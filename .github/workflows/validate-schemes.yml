name: Validate Scheme Specifications

on:
  push:
    branches: [ main ]
    paths:
      - 'data/schemes/**'
      - 'packages/shared/scheme/**'
      - '.github/workflows/validate-schemes.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'data/schemes/**'
      - 'packages/shared/scheme/**'
      - '.github/workflows/validate-schemes.yml'

jobs:
  validate-schemes:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Run Unit Tests
        run: |
          python -m unittest discover -s packages/shared/scheme/tests -v

      - name: Validate All Scheme Specification YAML Files
        run: |
          python -m packages.shared.scheme.cli validate data/schemes/
