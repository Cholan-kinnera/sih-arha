# ==============================================================================
# SYNTHETIC SCHEME SPECIFICATION EXAMPLE
# ==============================================================================
# Note: This is a synthetic example created for schema demonstration purposes.
# It does NOT represent real government scheme data.
# ==============================================================================

scheme:
  id: "SCHEME-SYNTH-001"
  code: "SYNTH-SHEAS-2026"
  name: "Synthetic Higher Education Financial Assistance Scheme"
  short_name: "SHEFAS"
  slug: "synthetic-higher-education-financial-assistance"
  version: "1.0.0"
  status: "ACTIVE"
  effective_from: "2026-01-01"
  effective_until: null

metadata:
  ministry: "Ministry of Synthetic Welfare"
  department: "Department of Higher Education"
  category: "SCHOLARSHIP"
  description: |
    A synthetic model scheme designed to provide financial grants to eligible 
    undergraduate students from lower-income households.
  objective: |
    To support meritorious post-secondary students with annual grants for tuition 
    and educational expenses.
  target_beneficiaries:
    - "Undergraduate College Students"
    - "Low-Income Families"
  tags:
    - "education"
    - "scholarship"
    - "synthetic-demo"

geographic_scope:
  level: "STATE"
  states:
    - "Karnataka"
  districts: []

sources:
  - id: "SRC-SYNTH-001"
    type: "GAZETTE_NOTIFICATION"
    title: "Synthetic Education Welfare Guidelines No. 2026/SYNTH-01"
    publisher: "Department of Higher Education, Synthetic State Govt"
    url: "https://example.gov.in/synthetic-guidelines-2026.pdf"
    document_reference: "Section 3.2 (Eligibility Criteria)"
    publication_date: "2025-12-01"
    effective_date: "2026-01-01"
    retrieved_at: "2026-08-21T00:00:00Z"
    version: "1.0"

eligibility:
  operator: "AND"
  groups:
    - operator: "OR"
      name: "education_enrollment_type"
      rules:
        - rule_id: "RUL-004"
          name: "full_time_undergraduate"
          source_id: "SRC-SYNTH-001"
          citation: "Section 3.2.c - Full-time enrollment"
          attribute: "citizen.education.enrollment_type"
          operator: "EQUALS"
          value: "FULL_TIME_UNDERGRADUATE"
          unit: null
          evidence_requirement:
            document_type: "COLLEGE_BONAFIDE_CERTIFICATE"
            verification_required: true
          missing_info_behavior:
            state_if_missing: "INSUFFICIENT_INFORMATION"
            user_prompt: "Are you enrolled full-time in an accredited undergraduate degree program?"
          explainability:
            success_msg: "Enrolled in an eligible full-time undergraduate program."
            failure_msg: "Program enrollment type must be full-time undergraduate."

        - rule_id: "RUL-005"
          name: "integrated_diploma_degree"
          source_id: "SRC-SYNTH-001"
          citation: "Section 3.2.c - Integrated diploma-degree option"
          attribute: "citizen.education.enrollment_type"
          operator: "EQUALS"
          value: "INTEGRATED_DIPLOMA_DEGREE"
          unit: null
          evidence_requirement:
            document_type: "COLLEGE_BONAFIDE_CERTIFICATE"
            verification_required: true
          missing_info_behavior:
            state_if_missing: "INSUFFICIENT_INFORMATION"
            user_prompt: "Are you enrolled in an integrated diploma-degree program?"
          explainability:
            success_msg: "Enrolled in an eligible integrated diploma-degree program."
            failure_msg: "Program enrollment type is not integrated diploma-degree."

  rules:
    # 1. Income Condition
    - rule_id: "RUL-001"
      name: "family_income_limit"
      source_id: "SRC-SYNTH-001"
      citation: "Section 3.2.a - Income Ceiling"
      attribute: "citizen.financial.annual_family_income"
      operator: "LESS_THAN_OR_EQUAL"
      value: 300000
      unit: "INR"
      evidence_requirement:
        document_type: "INCOME_CERTIFICATE"
        verification_required: true
      missing_info_behavior:
        state_if_missing: "INSUFFICIENT_INFORMATION"
        user_prompt: "What is your total annual family income in Rupees?"
      explainability:
        success_msg: "Annual family income is within the limit of ₹3,00,000."
        failure_msg: "Annual family income exceeds the maximum limit of ₹3,00,000."

    # 2. Age Condition
    - rule_id: "RUL-002"
      name: "applicant_age_range"
      source_id: "SRC-SYNTH-001"
      citation: "Section 3.2.b - Age Requirement"
      attribute: "citizen.personal.age"
      operator: "IN_RANGE"
      value: [17, 25]
      unit: "YEARS"
      evidence_requirement:
        document_type: "BIRTH_CERTIFICATE_OR_AADHAAR"
        verification_required: true
      missing_info_behavior:
        state_if_missing: "INSUFFICIENT_INFORMATION"
        user_prompt: "What is your current age?"
      explainability:
        success_msg: "Age is within the eligible range of 17 to 25 years."
        failure_msg: "Age must be between 17 and 25 years."

    # 3. Geographic Domicile Condition
    - rule_id: "RUL-003"
      name: "state_domicile"
      source_id: "SRC-SYNTH-001"
      citation: "Section 3.1 - Residential Scope"
      attribute: "citizen.location.state"
      operator: "EQUALS"
      value: "Karnataka"
      unit: null
      evidence_requirement:
        document_type: "DOMICILE_CERTIFICATE"
        verification_required: true
      missing_info_behavior:
        state_if_missing: "INSUFFICIENT_INFORMATION"
        user_prompt: "In which Indian state do you hold permanent residence?"
      explainability:
        success_msg: "Permanent resident of Karnataka."
        failure_msg: "Applicant must be a permanent resident of Karnataka."

documents:
  - type: "INCOME_CERTIFICATE"
    required: true
    purpose: "To verify annual family income limit of ₹3.0 Lakh."
    validity_required: true
    validity_period_months: 12
    valid_until_required: true
    acceptable_issuers:
      - "Tahsildar / Revenue Department"
    notes: "Certificate must be issued within the current financial year."

  - type: "DOMICILE_CERTIFICATE"
    required: true
    purpose: "To confirm Karnataka state residence."
    validity_required: false
    validity_period_months: null
    valid_until_required: false
    acceptable_issuers:
      - "Revenue Department / District Magistrate"
    notes: "Permanent domicile certificate required."

  - type: "COLLEGE_BONAFIDE_CERTIFICATE"
    required: true
    purpose: "To confirm active college enrollment."
    validity_required: true
    validity_period_months: 6
    valid_until_required: false
    acceptable_issuers:
      - "College Principal / Registrar"
    notes: "Must be on official college letterhead with seal."

  - type: "BIRTH_CERTIFICATE_OR_AADHAAR"
    required: true
    purpose: "To verify age of applicant."
    validity_required: false
    validity_period_months: null
    valid_until_required: false
    acceptable_issuers:
      - "UIDAI / Municipal Registrar of Births"
    notes: "Aadhaar or official Birth Certificate."


benefits:
  - type: "DIRECT_BENEFIT_TRANSFER"
    description: "Annual education grant credited directly to student bank account."
    amount_min: 40000
    amount_max: 40000
    frequency: "ANNUAL"
    currency: "INR"

application:
  channels:
    - type: "ONLINE_PORTAL"
      name: "Synthetic State Higher Education Portal"
      url: "https://example.gov.in/synthetic-scholarships"
      address_info: null

  procedure:
    - step_number: 1
      title: "Online Account Registration"
      description: "Register on the portal using Aadhaar and mobile number OTP."
      action_required: "Create Portal Account"
      estimated_days: 1

    - step_number: 2
      title: "Document Upload & Form Submission"
      description: "Fill application form and upload income, domicile, and bonafide certificates."
      action_required: "Submit Application & Evidence"
      estimated_days: 3

    - step_number: 3
      title: "Institutional & Departmental Verification"
      description: "Verification by college registrar followed by district welfare officer."
      action_required: "Await Verification"
      estimated_days: 14

rag_metadata:
  topic_keywords:
    - "scholarship"
    - "higher education"
    - "income limit 3 lakh"
    - "karnataka domicile"
  summary_chunks:
    - "The Synthetic Higher Education Financial Assistance Scheme provides ₹40,000 annual scholarship to Karnataka domiciled students aged 17-25 with family income <= ₹3 Lakh enrolled in undergraduate degrees."
