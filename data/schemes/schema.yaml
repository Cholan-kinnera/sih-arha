# ==============================================================================
# CANONICAL SCHEME SPECIFICATION SCHEMA (CBIP DATA CONTRACT)
# ==============================================================================
# This template defines the machine-readable data contract for government schemes.
# All scheme definitions in data/schemes/ must validate against this schema.
# ==============================================================================

scheme:
  id: "SCHEME-ID-HERE"                 # Unique string identifier (e.g., SCHEME-KAR-001)
  code: "SCHEME-CODE-HERE"             # Official reference code (e.g., PM-KISAN-2026)
  name: "Full Scheme Name"             # Official full title of the scheme
  short_name: "Short Name"             # Abbreviated name or acronym
  slug: "scheme-slug-name"             # URL-friendly slug identifier
  version: "1.0.0"                     # Semver scheme specification version
  status: "ACTIVE"                     # Status: DRAFT | ACTIVE | DEPRECATED | SUPERSEDED
  effective_from: "YYYY-MM-DD"         # Date scheme became effective
  effective_until: null                # End date if sunsetted, or null if ongoing

metadata:
  ministry: "Ministry Name"            # Nodal Ministry / Department
  department: "Department Name"        # Nodal Department
  category: "CATEGORY_ENUM"            # AGRICULTURE | EDUCATION | HEALTHCARE | HOUSING | FINANCIAL_INCLUSION | SOCIAL_SECURITY | WOMEN_AND_CHILD | SCHOLARSHIP
  description: |                      # High-level summary of the scheme
    Multi-line plain text summary of the scheme's purpose and scope.
  objective: |                        # Specific policy objective
    Specific objective statement.
  target_beneficiaries:                # Audience labels
    - "Target Group 1"
    - "Target Group 2"
  tags:                                # Subject taxonomy tags for UI/RAG
    - "tag-1"
    - "tag-2"

geographic_scope:
  level: "NATIONAL"                    # Scope level: NATIONAL | STATE | DISTRICT
  states: []                           # List of state names (empty if NATIONAL)
  districts: []                        # List of district names (empty if STATE/NATIONAL)

# ==============================================================================
# AUTHORITATIVE SOURCE CITATIONS
# ==============================================================================
sources:
  - id: "SRC-001"                      # Local source identifier referenced by rules
    type: "GAZETTE_NOTIFICATION"       # GAZETTE_NOTIFICATION | OFFICIAL_PORTAL | SCHEME_GUIDELINE | EXECUTIVE_ORDER
    title: "Official Source Title"     # Title of publication/guideline
    publisher: "Publishing Authority"   # Official government publisher
    url: "https://official-url.gov.in" # Authoritative web link
    document_reference: "Section 4.1"  # Specific section / page reference
    publication_date: "YYYY-MM-DD"     # Date published
    effective_date: "YYYY-MM-DD"       # Date effective in source
    retrieved_at: "YYYY-MM-DDTHH:MM:SSZ" # ISO UTC retrieval timestamp
    version: "1.0"                     # Source document version

# ==============================================================================
# DECLARATIVE ELIGIBILITY RULES TREE
# ==============================================================================
eligibility:
  operator: "AND"                      # Root operator: AND | OR | NOT
  groups: []                           # Optional nested rule groups
  rules:
    - rule_id: "RUL-001"               # Unique rule identifier
      name: "rule_name_key"            # Descriptive rule key
      source_id: "SRC-001"             # Reference to sources array item
      citation: "Section reference"    # Specific source section citation
      
      # Citizen Attribute Binding
      attribute: "citizen.domain.field"# Canonical attribute path (e.g., citizen.financial.annual_family_income)
      operator: "LESS_THAN_OR_EQUAL"   # Operators: EQUALS | NOT_EQUALS | LESS_THAN | LESS_THAN_OR_EQUAL | GREATER_THAN | GREATER_THAN_OR_EQUAL | IN_RANGE | IN_SET | NOT_IN_SET | IS_TRUE | IS_FALSE
      value: 300000                    # Value threshold, boolean, or array
      unit: "INR"                      # Unit specification: INR | YEARS | HECTARES | PERCENTAGE | null

      # Evidence & Verification Requirements
      evidence_requirement:
        document_type: "DOCUMENT_ENUM" # e.g., INCOME_CERTIFICATE | AADHAAR_CARD | RATION_CARD
        verification_required: true    # Whether document evidence is required

      # Missing Attribute Behavior
      missing_info_behavior:
        state_if_missing: "INSUFFICIENT_INFORMATION" # INSUFFICIENT_INFORMATION | POTENTIALLY_ELIGIBLE
        user_prompt: "Question prompt to ask citizen when attribute is missing?"

      # Explainability Templates
      explainability:
        success_msg: "Explanation when rule condition passes."
        failure_msg: "Explanation when rule condition fails."

# ==============================================================================
# REQUIRED DOCUMENTS & EVIDENCE SPECIFICATIONS
# ==============================================================================
documents:
  - type: "DOCUMENT_ENUM"              # Document type code
    required: true                     # Is mandatory for application
    purpose: "Purpose description"     # Why this document is required
    validity_required: true            # Does document require unexpired validity
    validity_period_months: 12         # Expiry period in months (null if permanent)
    valid_until_required: false        # Must have explicit valid_until date
    acceptable_issuers:                # Recognized issuing authorities
      - "Issuing Authority Name"
    notes: "Additional guidance notes for document upload."

# ==============================================================================
# SCHEME BENEFITS SPECIFICATION
# ==============================================================================
benefits:
  - type: "DIRECT_BENEFIT_TRANSFER"    # DIRECT_BENEFIT_TRANSFER | SUBSIDY | INSURANCE_COVER | LOAN | SERVICE
    description: "Benefit summary"     # Plain text description of benefit
    amount_min: 0                      # Minimum monetary benefit amount (INR)
    amount_max: 0                      # Maximum monetary benefit amount (INR)
    frequency: "ONE_TIME"              # ONE_TIME | MONTHLY | QUARTERLY | ANNUAL
    currency: "INR"

# ==============================================================================
# APPLICATION READINESS & CHANNELS
# ==============================================================================
application:
  channels:
    - type: "ONLINE_PORTAL"            # ONLINE_PORTAL | CSC_CENTER | DISTRICT_OFFICE | MOBILE_APP
      name: "Portal Name"
      url: "https://official-portal.gov.in"
      address_info: null
  procedure:
    - step_number: 1
      title: "Step Title"
      description: "Detailed description of action required."
      action_required: "Citizen action item"
      estimated_days: 7

# ==============================================================================
# RAG INDEXING HINTS & METADATA
# ==============================================================================
rag_metadata:
  topic_keywords:
    - "keyword1"
    - "keyword2"
  summary_chunks:
    - "High-signal scheme summary chunk for vector embedding generation."
