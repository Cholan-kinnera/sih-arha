[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cbip"
version = "0.1.0"
description = "Citizen Benefits Intelligence Platform (CBIP)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0.0",
    "pyyaml>=6.0"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["packages*"]
